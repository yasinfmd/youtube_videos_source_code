<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>musictocolor</title>

    <style>
   * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    width: 100%;
    background: radial-gradient(circle at center, #3a3a3a, #111);
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  #info {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.2rem;
    z-index: 10;
  }

  #gameArea {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 1 / 1;         
    width: 90vmin;               
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 2vmin;
  }

  .hole {
    position: relative;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #222, #000 80%);
    box-shadow: inset 0 8px 15px rgba(0,0,0,0.8), inset 0 -3px 5px rgba(255,255,255,0.05);
    overflow: hidden;
  }

  .mole {
    position: absolute;
    width: 70%;
    aspect-ratio: 1/1;
    left: 50%;
    bottom: -100%;
    transform: translateX(-50%);
    background: radial-gradient(circle at 40% 30%, #8b4513, #5c3317);
    border-radius: 50%;
    transition: bottom 0.3s ease-out;
    cursor: pointer;
  }

  .mole::before {
    content: "";
    position: absolute;
    width: 60%;
    height: 25%;
    top: 20%;
    left: 20%;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
  }

  .up {
    bottom: 10%;
  }
</style>
  </head>
  <body>

   <div id="info">
  Puan: <b id="score">0</b> | Seviye: <b id="level">1</b>
</div>

<div id="gameArea">
  <div class="hole"><div class="mole"></div></div>
  <div class="hole"><div class="mole"></div></div>
  <div class="hole"><div class="mole"></div></div>
  <div class="hole"><div class="mole"></div></div>
  <div class="hole"><div class="mole"></div></div>
  <div class="hole"><div class="mole"></div></div>
  <div class="hole"><div class="mole"></div></div>
  <div class="hole"><div class="mole"></div></div>
  <div class="hole"><div class="mole"></div></div>
</div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
